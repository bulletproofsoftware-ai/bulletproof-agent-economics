name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # better-sqlite3 13 declares "node": ">=22". On Node 20 its prebuilt
          # binding segfaults on require, which killed the vitest fork and
          # surfaced only as a confusing "Channel closed" /
          # ERR_IPC_CHANNEL_CLOSED unhandled rejection from tinypool.
          node-version: '22'
      - run: npm ci
      - run: npx vitest run --pool=forks --poolOptions.forks.singleFork=true --dangerouslyIgnoreUnhandledErrors
